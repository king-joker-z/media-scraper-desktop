appId: com.mediascraper.desktop
productName: Media Scraper
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - node_modules/ffprobe-static/**
  - node_modules/ffmpeg-static/**
  # sharp 为原生 C++ 模块：.node 二进制无法从 asar 内 dlopen，必须解包；
  # sharp 0.35+ 的平台二进制在可选依赖 @img/* 中，一并解包
  - node_modules/sharp/**
  - node_modules/@img/**
win:
  executableName: MediaScraper
  # exe/安装向导/快捷方式图标（build/icon.ico 已存在）
  icon: build/icon.ico
nsis:
  # 辅助安装模式：用户可选择安装路径、阅读许可，而非一键静默安装
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: always
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
mac:
  # 无 Apple Developer ID 证书阶段：显式 ad-hoc 签名，避免误用本机无关证书
  identity: null
  gatekeeperAssess: false
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# 自动更新源：GitHub Releases（v* tag 构建产物已由 CI 上传）
# 注意：私有仓库下检查更新会 404，设置页会展示「检查失败」；仓库转公开后即可用
publish:
  provider: github
  owner: king-joker-z
  repo: media-scraper-desktop
