name: Build desktop installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 缓存整个 node_modules（含 ffmpeg-static postinstall 下载的二进制），命中则跳过 npm ci
      - name: Cache node_modules
        uses: actions/cache@v4
        id: deps
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build-windows:
    name: Windows installer
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache node_modules
        uses: actions/cache@v4
        id: deps
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      # GH_TOKEN：electron-builder publish(github) 需要。
      # 仅 tag 构建发布到 Release（--publish always）；分支/PR 构建显式 never，
      # 防止 onTagOrDraft 撞上同名草稿 Release 的资产导致 422 already_exists
      - run: npm run build:win -- --publish ${{ github.ref_type == 'tag' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: media-scraper-desktop-win-x64
          path: dist/*.exe
          if-no-files-found: error
          # 安装包体积大，7 天过期防止 artifact 存储配额被打满
          retention-days: 7

  build-macos:
    name: macOS installer
    needs: quality
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache node_modules
        uses: actions/cache@v4
        id: deps
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run build:mac -- --publish ${{ github.ref_type == 'tag' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: media-scraper-desktop-macos
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7
